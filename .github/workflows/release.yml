name: Build and publish E HUD

on:
  push:
    tags:
      - "v*-alpha"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Build Minecraft 1.21 through 1.21.11
        shell: pwsh
        run: ./1.21.x/build-all.ps1 -JavaExe "$env:JAVA_HOME/bin/java.exe"

      - name: Verify the Minecraft 1.21.x jars
        shell: pwsh
        run: ./1.21.x/verify-releases.ps1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Build Minecraft 26.1 and 26.2
        shell: pwsh
        run: ./26.x/build-26.ps1 -JavaExe "$env:JAVA_HOME/bin/java.exe"

      - name: Verify the Minecraft 26.x jars
        shell: pwsh
        run: ./26.x/verify-releases.ps1

      - name: Assemble the complete release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 1.21.x/releases/e-hud-*.jar dist/
          Copy-Item 26.x/releases/e-hud-*.jar dist/
          $jars = Get-ChildItem dist -Filter 'e-hud-*.jar' | Sort-Object Name
          if ($jars.Count -ne 14) {
            throw "Expected 14 release jars, found $($jars.Count)."
          }
          $checksums = $jars | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          Set-Content -LiteralPath dist/SHA256SUMS.txt -Value $checksums -Encoding utf8

      - name: Upload the verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: e-hud-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Download the verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: e-hud-${{ github.ref_name }}
          path: dist

      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "E HUD $release_version" \
              --notes-file "release-notes/$release_version.md" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "E HUD $release_version" \
              --notes-file "release-notes/$release_version.md" \
              --prerelease
          fi

  modrinth:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Download the verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: e-hud-${{ github.ref_name }}
          path: dist

      - name: Publish separate alpha versions to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          python .github/scripts/publish_modrinth_release.py \
            --version "$release_version" \
            --artifacts dist \
            --changelog "release-notes/$release_version.md"

name: Discord release notifications

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-release-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube metadata helper
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp

      - name: Check for new uploads and releases
        env:
          DISCORD_YOUTUBE_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_WEBHOOK }}
          DISCORD_SHORTS_WEBHOOK: ${{ secrets.DISCORD_SHORTS_WEBHOOK }}
          DISCORD_MODRINTH_WEBHOOK: ${{ secrets.DISCORD_MODRINTH_WEBHOOK }}
          YOUTUBE_ROLE_ID: ${{ vars.YOUTUBE_ROLE_ID }}
          SHORTS_ROLE_ID: ${{ vars.SHORTS_ROLE_ID }}
          MODRINTH_ROLE_ID: ${{ vars.MODRINTH_ROLE_ID }}
        run: python .github/scripts/discord_notifications.py

      - name: Save notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/notification-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update notification state [skip ci]"
            git push
          fi

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def minecraftParts = project.minecraft_version.tokenize('.').collect { it as int }
def modernInputApi = minecraftParts.size() > 2 && minecraftParts[2] >= 9
def modernGuiPose = minecraftParts.size() > 2 && minecraftParts[2] >= 6

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        ehud {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.client.java.srcDir(modernInputApi ? 'src/clientModern/java' : 'src/clientLegacy/java')
sourceSets.client.java.srcDir(modernGuiPose ? 'src/poseModern/java' : 'src/poseLegacy/java')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Kept local so a transient TerraformersMC Maven outage cannot make the
    // optional configuration integration fail the whole build.
    modCompileOnly files("libs/modmenu-${project.modmenu_version}.jar")
    modLocalRuntime files("libs/modmenu-${project.modmenu_version}.jar")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version, minecraft_version: inputs.properties.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('README.md')
    from('MOD_DESCRIPTION.md')
    from('FEATURES.md')
    from('CHANGELOG.md')
    from('LICENSE')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
